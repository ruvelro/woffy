{% extends "base.html" %}{% block title %}Informes{% endblock %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Resumen</p><h1>Informes</h1><p>Genera el mismo informe agregado que la CLI y, si quieres, envíalo a Telegram.</p></div></div><section class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Desde<input type="date" name="from_date" value="{{ from_date }}" required></label><label>Hasta<input type="date" name="to_date" value="{{ to_date }}" required></label><label>Formato<select name="format"><option value="text">Texto</option><option value="json">JSON</option><option value="csv">CSV</option></select></label><label class="check"><input type="checkbox" name="telegram"> Enviar también a Telegram</label><button>Generar</button></form>{% if report %}<pre class="report-output">{{ report }}</pre>{% endif %}</section>
{% endblock %}
