name: shell-ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt bats sqlite3

      - name: Shellcheck
        run: shellcheck woffy.sh install-woffy.sh

      - name: Shfmt
        run: |
          shfmt -d -i 2 -ci woffy.sh install-woffy.sh || true
          echo "shfmt is currently non-blocking"

      - name: Bats tests
        run: bats tests
