name: shell-ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Syntax and shellcheck
        run: |
          bash scripts/build-woffy.sh --check
          bash -n woffy.sh
          bash -n install-woffy.sh
          shellcheck woffy.sh install-woffy.sh
      - name: Formatting
        run: shfmt -d -i 2 -ci woffy.sh install-woffy.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3 jq
      - name: Install macOS tooling
        if: runner.os == 'macOS'
        run: brew install bats-core sqlite jq
      - name: Bash 3.2 compatibility syntax
        if: runner.os == 'macOS'
        run: /bin/bash -n woffy.sh
      - name: Bats tests
        run: bats tests
      - name: VPS update simulation
        run: bash tests/vps-update-smoke.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: web/requirements-dev.lock
      - name: Install web tooling
        run: |
          python -m pip install --disable-pip-version-check -r web/requirements-dev.lock
          python -m playwright install --with-deps chromium
      - name: Vendor local browser assets
        run: bash scripts/vendor-web-assets.sh
      - name: Compile and test web panel
        env:
          PYTHONPATH: web
        run: |
          ruff check web/woffy_web tests/test_web.py tests/test_web_e2e.py
          ruff format --check web/woffy_web tests/test_web.py tests/test_web_e2e.py
          python -m compileall -q web/woffy_web
          pytest -q tests/test_web.py tests/test_web_e2e.py
      - name: Build offline web artifact
        run: |
          bash scripts/build-web-artifact.sh dist
          tar -tzf dist/woffy-web.tar.gz | grep -q '^app/woffy_web/app.py$'
          test -s dist/woffy-web.sha256
      - name: Install and rollback web artifact like the VPS
        run: bash tests/web-install-smoke.sh
